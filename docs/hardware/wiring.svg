<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Power Kettle wiring diagram</title>
  <desc id="d">LiPo to TP4056 B+ and B-; TP4056 OUT+ through the slide switch and a Schottky diode (band on the C3 side) to the ESP32-C3 5V pin; OUT- is ground. B- is not ground. C3 3V3, GND, GPIO6 SDA, GPIO7 SCL and GPIO3 INT1 go to the BMI160. Battery divider from OUT+ before the switch through two 100 kilohm resistors to GPIO4 and ground. BMI160 CS tied high and SAO tied low. Rule: slide switch off before plugging anything into the C3 USB-C; charge only through the TP4056 USB-C port.</desc>
  <style>
    .bg { fill: #fbfaf6; stroke: #333; stroke-width: 1; }
    .box { fill: #eef1f6; stroke: #222; stroke-width: 2; }
    .part { fill: #e9edf3; stroke: #222; stroke-width: 2; }
    .warn { fill: #fff1c2; stroke: #8a5a00; stroke-width: 2; }
    .rule { fill: #fde0dc; stroke: #a1261c; stroke-width: 2; }
    .ttl { font-size: 17px; font-weight: bold; fill: #111; }
    .lbl { font-size: 13px; fill: #111; }
    .pin { font-size: 13px; fill: #111; font-weight: bold; }
    .sub { font-size: 12px; fill: #333; }
    .note { font-size: 13px; fill: #111; }
    .wt { font-size: 13px; fill: #111; font-weight: bold; }
    .w { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .pos { stroke: #b3261e; }
    .gnd { stroke: #222; }
    .bm { stroke: #0b7a75; }
    .sda { stroke: #1f5fbf; }
    .scl { stroke: #1e7a3c; }
    .int { stroke: #b4600a; }
    .mid { stroke: #7b3fa0; }
    .dot { fill: #111; }
    .dfill { fill: #222; stroke: #222; stroke-width: 2; }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="999" height="529" rx="6"/>
  <text class="ttl" x="20" y="26">Power Kettle wiring (red = power, black = ground, teal = battery B&#8722; only)</text>

  <!-- LiPo -->
  <rect class="box" x="30" y="60" width="130" height="80" rx="6"/>
  <text class="ttl" x="45" y="92">LiPo</text>
  <text class="sub" x="45" y="110">1S ~300 mAh</text>
  <text class="pin" x="146" y="86" text-anchor="end">+</text>
  <text class="pin" x="146" y="126" text-anchor="end">&#8722;</text>

  <!-- TP4056 -->
  <rect class="box" x="220" y="40" width="150" height="130" rx="6"/>
  <text class="ttl" x="295" y="66" text-anchor="middle">TP4056</text>
  <text class="sub" x="295" y="150" text-anchor="middle">USB-C = CHARGE only</text>
  <text class="sub" x="295" y="164" text-anchor="middle">(protected board)</text>
  <text class="pin" x="228" y="86">B+</text>
  <text class="pin" x="228" y="126">B&#8722;</text>
  <text class="pin" x="362" y="86" text-anchor="end">OUT+</text>
  <text class="pin" x="362" y="126" text-anchor="end">OUT&#8722;</text>

  <!-- LiPo to TP4056: + red, B- teal (NOT ground) -->
  <path class="w pos" d="M160 82 H220"/>
  <path class="w bm" d="M160 122 H220"/>

  <!-- OUT+ to switch, diode, C3 5V -->
  <path class="w pos" d="M370 82 H410"/>
  <rect class="part" x="410" y="66" width="72" height="32" rx="6"/>
  <text class="sub" x="446" y="86" text-anchor="middle">slide switch</text>
  <path class="w pos" d="M482 82 H500"/>
  <polygon class="dfill" points="500,70 500,94 524,82"/>
  <path class="w gnd" d="M527 68 V96"/>
  <path class="w pos" d="M527 82 H560"/>
  <text class="sub" x="552" y="58" text-anchor="end">diode (SS14)</text>

  <!-- OUT- to GND, with a hop over the divider wire (no connection there) -->
  <path class="w gnd" d="M370 122 H386 a6 6 0 0 1 12 0 H560"/>

  <!-- ESP32-C3 -->
  <rect class="box" x="560" y="40" width="160" height="340" rx="6"/>
  <text class="ttl" x="662" y="272" text-anchor="middle">ESP32-C3</text>
  <text class="sub" x="662" y="290" text-anchor="middle">SuperMini</text>
  <text class="sub" x="662" y="306" text-anchor="middle">USB-C = flashing:</text>
  <text class="sub" x="662" y="320" text-anchor="middle">switch OFF first</text>
  <text class="pin" x="568" y="86">5V</text>
  <text class="pin" x="568" y="126">GND</text>
  <text class="pin" x="568" y="326">GPIO4</text>
  <text class="pin" x="712" y="86" text-anchor="end">3V3</text>
  <text class="pin" x="712" y="126" text-anchor="end">GND</text>
  <text class="pin" x="712" y="166" text-anchor="end">GPIO6</text>
  <text class="pin" x="712" y="206" text-anchor="end">GPIO7</text>
  <text class="pin" x="712" y="246" text-anchor="end">GPIO3</text>

  <!-- BMI160 -->
  <rect class="box" x="840" y="40" width="140" height="340" rx="6"/>
  <text class="ttl" x="910" y="364" text-anchor="middle">BMI160</text>
  <text class="pin" x="848" y="86">3V3</text>
  <text class="pin" x="848" y="126">GND</text>
  <text class="pin" x="848" y="166">SDA</text>
  <text class="pin" x="848" y="206">SCL</text>
  <text class="pin" x="848" y="246">INT1</text>
  <text class="pin" x="848" y="286">CS</text>
  <text class="pin" x="848" y="326">SAO</text>

  <!-- C3 to BMI160 -->
  <path class="w pos" d="M720 82 H840"/>
  <path class="w gnd" d="M720 122 H840"/>
  <path class="w sda" d="M720 162 H840"/>
  <path class="w scl" d="M720 202 H840"/>
  <path class="w int" d="M720 242 H840"/>
  <text class="sub" x="780" y="76" text-anchor="middle">3.3 V</text>
  <text class="sub" x="780" y="156" text-anchor="middle">I&#178;C data</text>
  <text class="sub" x="780" y="196" text-anchor="middle">I&#178;C clock</text>
  <text class="sub" x="780" y="236" text-anchor="middle">FIFO watermark</text>

  <!-- CS tied high, SAO tied low -->
  <path class="w pos" d="M840 282 H800"/>
  <text class="sub" x="796" y="286" text-anchor="end">tie to 3V3</text>
  <path class="w gnd" d="M840 322 H800"/>
  <text class="sub" x="796" y="326" text-anchor="end">tie to GND</text>

  <!-- Battery divider, tapped on OUT+ before the switch -->
  <circle class="dot" cx="392" cy="82" r="5"/>
  <path class="w pos" d="M392 82 V200"/>
  <rect class="part" x="377" y="200" width="30" height="60" rx="3"/>
  <text class="lbl" x="420" y="235">100 k&#937;</text>
  <path class="w mid" d="M392 260 V360"/>
  <circle class="dot" cx="392" cy="330" r="5"/>
  <path class="w mid" d="M392 330 H560"/>
  <text class="lbl" x="478" y="322" text-anchor="middle">half the battery voltage</text>
  <rect class="part" x="377" y="360" width="30" height="60" rx="3"/>
  <text class="lbl" x="420" y="395">100 k&#937;</text>
  <path class="w gnd" d="M392 420 V448"/>
  <path class="w gnd" d="M372 448 H412"/>
  <path class="w gnd" d="M380 458 H404"/>
  <path class="w gnd" d="M388 468 H396"/>
  <text class="lbl" x="424" y="462">to GND</text>
  <text class="sub" x="420" y="150">divider taps OUT+</text>
  <text class="sub" x="420" y="164">(before switch + diode)</text>

  <!-- B- warning -->
  <rect class="warn" x="30" y="170" width="165" height="96" rx="6"/>
  <text class="wt" x="40" y="190">B&#8722; is NOT ground.</text>
  <text class="note" x="40" y="208">Only the battery</text>
  <text class="note" x="40" y="224">connects to B&#8722;.</text>
  <text class="note" x="40" y="246">Ground = OUT&#8722;.</text>

  <!-- Notes -->
  <text class="note" x="560" y="406">Diode: plain end (anode) to the switch, band (cathode) to C3 5V.</text>
  <text class="note" x="560" y="424">Ground is TP4056 OUT&#8722;, both C3 GND pads and BMI160 GND.</text>
  <text class="note" x="560" y="442">BMI160 3V3 pin is fed from the C3 3V3 pin (not the 5V).</text>
  <text class="note" x="560" y="460">Do not use GPIO2, GPIO8 or GPIO9. Black wire hop = no connection.</text>
  <text class="note" x="560" y="478">Check CS / SAO pin labels on your board's silkscreen.</text>

  <!-- Rule -->
  <rect class="rule" x="20" y="490" width="960" height="30" rx="6"/>
  <text class="wt" x="500" y="510" text-anchor="middle">RULE: slide switch OFF before plugging anything into the C3's USB-C. Charge ONLY through the TP4056's USB-C port.</text>
</svg>
