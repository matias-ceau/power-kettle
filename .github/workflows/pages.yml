name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install platformio
      - run: pio run -e c3
        working-directory: firmware
      - run: bash scripts/merge_bin.sh
        working-directory: firmware
      - name: Assemble site
        run: |
          mkdir site
          cp -r app/. site/
          cp firmware/.pio/build/c3/merged.bin site/firmware/merged.bin
          sed -i "s/\"version\":\"[^\"]*\"/\"version\":\"${GITHUB_SHA::7}\"/" site/firmware/manifest.json
          cat site/firmware/manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
