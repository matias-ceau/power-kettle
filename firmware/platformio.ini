; `pio run` builds the device firmware; the native env is only for `pio test -e native`
; (src/ needs Arduino and is not compiled there: test_build_src defaults to no).
[platformio]
default_envs = c3

[env:c3]
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@2.5.1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
